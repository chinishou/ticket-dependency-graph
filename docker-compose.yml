# docker-compose.yml — runs the app server + ShotGrid event daemon together.
#
# Works with:
#   - docker compose (Docker v20+ built-in)
#   - docker-compose v1 (older standalone)
#   - podman-compose
#   - podman compose (v4+, with python-dotenv backend)
#
# Usage:
#   1. Copy .env.example to .env and fill in real secrets (especially
#      ADMIN_PASSWORD, SG_INTERNAL_SECRET, SG_ED_SITE_URL/SCRIPT_NAME/API_KEY).
#   2. docker compose up -d --build
#   3. Open http://localhost:3001
#
# To upgrade after a code change: `docker compose up -d --build` again — the
# named volumes preserve the SQLite DB and the daemon's eventIdFile.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-dep-graph:latest
    container_name: tdg-app
    restart: unless-stopped
    ports:
      # APP_HOST_PORT lets you avoid host-side conflicts (defaults to 3001).
      - "${APP_HOST_PORT:-3001}:3001"
    volumes:
      - tdg-data:/data        # SQLite DB
      - tdg-logs:/app/logs    # app.log audit trail
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  sg-event-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
      # Pin shotgunEvents to a specific commit/tag for reproducible builds.
      # args:
      #   SHOTGUNEVENTS_REF: <commit-sha-or-tag>
    image: ticket-dep-graph-daemon:latest
    container_name: tdg-daemon
    restart: unless-stopped
    # Wait until the app's healthcheck passes before starting the daemon —
    # otherwise the first batch of forwarded events would fail with 502s.
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # eventIdFile + per-plugin logs. Persisting this means the daemon picks
      # up exactly where it left off after a restart; without it the daemon
      # would either re-process old events or skip events that occurred during
      # downtime.
      - tdg-daemon-state:/var/log/shotgunEventDaemon
    env_file:
      - .env
    # Override APP_API_URL: inside the compose network the app is reachable as
    # http://app:3001, not localhost. The .env value (used for bare-metal dev)
    # is wrong here.
    environment:
      APP_API_URL: http://app:3001

volumes:
  tdg-data:
  tdg-logs:
  tdg-daemon-state:
