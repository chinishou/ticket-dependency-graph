# docker-compose.yml — runs the ticket-dependency-graph app server.
#
# The ShotGrid event daemon used to be bundled here, but it now ships as its
# own standalone deployment so a single daemon can serve several apps. See
# docker-compose.daemon.yml for the daemon side. Both compose files are
# operated independently; they only share `.env` keys (SG_INTERNAL_SECRET
# must match the daemon's value).
#
# Works with:
#   - docker compose (Docker v20+ built-in)
#   - docker-compose v1 (older standalone)
#   - podman-compose
#   - podman compose (v4+, with python-dotenv backend)
#
# Usage:
#   1. Copy .env.example to .env and fill in real secrets (especially
#      ADMIN_PASSWORD, SG_INTERNAL_SECRET, SG_URL/SCRIPT_NAME/API_KEY).
#   2. docker compose up -d --build
#   3. Open http://localhost:3001
#
# To upgrade after a code change: `docker compose up -d --build` again — the
# named volumes preserve the SQLite DB.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-dep-graph:latest
    container_name: tdg-app
    restart: unless-stopped
    ports:
      # APP_HOST_PORT lets you avoid host-side conflicts (defaults to 3001).
      - "${APP_HOST_PORT:-3001}:3001"
    volumes:
      - tdg-data:/data        # SQLite DB
      - tdg-logs:/app/logs    # app.log audit trail
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tdg-data:
  tdg-logs:
