# docker-compose.daemon.yml — standalone ShotGrid event daemon deployment.
#
# Deploy this on its own host (or a shared "automation" VM) — separate from
# any consuming app. The daemon listens to ShotGrid events and POSTs them to
# one or more consuming apps over HTTP via the three plugins in
# sg-events-plugins/.
#
# Multi-app routing
# -----------------
# By default every plugin POSTs to APP_API_URL. If you want to route different
# entity types to different apps, set per-plugin overrides:
#
#   APP_API_URL_TICKET=http://ticket-app.internal:3001
#   APP_API_URL_HUMANUSER=http://hr-app.internal:8080
#   APP_API_URL_PROJECT=http://ticket-app.internal:3001
#
# Any of these that are unset fall back to APP_API_URL.
#
# Usage:
#   1. Copy .env.example to .env on the daemon host.
#   2. Set APP_API_URL (or the per-plugin variants) to point at the consuming
#      app(s). The daemon container needs network reachability to those URLs.
#   3. SG_INTERNAL_SECRET must EXACTLY MATCH the value on every consuming app.
#   4. docker compose -f docker-compose.daemon.yml up -d --build
#
# Logs: `docker compose -f docker-compose.daemon.yml logs -f`

services:
  sg-event-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
      # Pin shotgunEvents to a specific commit/tag for reproducible builds.
      # args:
      #   SHOTGUNEVENTS_REF: <commit-sha-or-tag>
    image: ticket-dep-graph-daemon:latest
    container_name: tdg-daemon
    restart: unless-stopped
    volumes:
      # eventIdFile + per-plugin logs. Persisting this means the daemon picks
      # up exactly where it left off after a restart; without it the daemon
      # would either re-process old events or skip events that occurred during
      # downtime.
      - tdg-daemon-state:/var/log/shotgunEventDaemon
    env_file:
      - .env

volumes:
  tdg-daemon-state:
